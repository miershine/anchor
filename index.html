<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor</title>
<meta name="description" content="A small daily ritual: prayer, your top 3, weather, and a spark of design inspiration.">
<meta name="theme-color" content="#F6F1E9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anchor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="header">
    <p class="eyebrow" id="dateLine">Friday, September 12</p>
    <h1 class="greeting" id="greeting">Good morning</h1>
  </header>

  <section class="card" id="prayerCard">
    <div class="card-head">
      <span class="card-icon">🕊️</span>
      <h2>Today's Anchor</h2>
    </div>
    <p class="card-hint">A moment before the day starts.</p>
    <textarea id="prayerInput" placeholder="Write your prayer, intention, or reflection for today…" rows="4"></textarea>
    <div class="save-state" id="prayerSaveState">&nbsp;</div>
  </section>

  <section class="card" id="tasksCard">
    <div class="card-head">
      <span class="card-icon">✦</span>
      <h2>Top 3 for today</h2>
    </div>
    <p class="card-hint">Not a to-do list. Just the three that matter.</p>
    <ul class="task-list" id="taskList"></ul>
  </section>

  <section class="card" id="weatherCard">
    <div class="card-head">
      <span class="card-icon">☀️</span>
      <h2>Sky</h2>
    </div>
    <div id="weatherBody">
      <p class="card-hint">See what today looks like outside.</p>
      <button class="btn" id="weatherBtn">Use my location</button>
    </div>
  </section>

  <section class="card" id="sparkCard">
    <div class="card-head">
      <span class="card-icon">💡</span>
      <h2>Design Spark</h2>
    </div>
    <div id="sparkBody"></div>
    <button class="btn ghost" id="shuffleBtn">Show me another</button>
  </section>

  <footer class="footer">
    <p>Made for slow mornings.</p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
